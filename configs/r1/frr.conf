frr defaults traditional
hostname r1
service integrated-vtysh-config
!
interface lo
 ip address 10.1.255.1/32
 ip ospf area 0
!
interface eth1
 ip address 10.1.0.1/30
 ip ospf area 0
 ip ospf network point-to-point
!
interface eth2
 ip address 100.64.1.2/30
!
router ospf
 ospf router-id 10.1.255.1
 redistribute bgp
!
ip route 10.1.0.0/16 blackhole
!
router bgp 65001
 bgp router-id 10.1.255.1
 no bgp ebgp-requires-policy
 neighbor 100.64.1.1 remote-as 65000
 neighbor 100.64.1.1 description ISP
 address-family ipv4 unicast
  network 10.1.0.0/16
 exit-address-family
!
