frr defaults traditional
hostname r4
service integrated-vtysh-config
!
interface lo
 ip address 10.2.255.4/32
 ip ospf area 0
!
interface eth1
 ip address 10.2.0.2/30
 ip ospf area 0
 ip ospf network point-to-point
!
interface eth2
 ip address 10.2.10.1/24
 ip ospf area 0
!
router ospf
 ospf router-id 10.2.255.4
 passive-interface eth2
!
