frr defaults traditional
hostname r3
service integrated-vtysh-config
!
interface lo
 ip address 10.2.255.3/32
 ip ospf area 0
!
interface eth1
 ip address 10.2.0.1/30
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf bfd
 ip ospf bfd profile fast
!
interface eth2
 ip address 100.64.2.2/30
!
router ospf
 ospf router-id 10.2.255.3
 redistribute bgp
!
ip route 10.2.0.0/16 blackhole
!
router bgp 65002
 bgp router-id 10.2.255.3
 no bgp ebgp-requires-policy
 neighbor 100.64.2.1 remote-as 65000
 neighbor 100.64.2.1 description ISP
 neighbor 100.64.2.1 bfd
 neighbor 100.64.2.1 bfd profile fast
 address-family ipv4 unicast
  network 10.2.0.0/16
 exit-address-family
!
bfd
 profile fast
  transmit-interval 200
  receive-interval 200
 exit
!
