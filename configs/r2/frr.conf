frr defaults traditional
hostname r2
service integrated-vtysh-config
!
interface lo
 ip address 10.1.255.2/32
 ip ospf area 0
!
interface eth1
 ip address 10.1.0.2/30
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf bfd
 ip ospf bfd profile fast
!
interface eth2
 ip address 10.1.10.1/24
 ip ospf area 0
 ip ospf passive
!
router ospf
 ospf router-id 10.1.255.2
!
bfd
 profile fast
  transmit-interval 200
  receive-interval 200
 exit
!
