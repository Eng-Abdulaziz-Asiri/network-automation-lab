frr defaults traditional
hostname r5
service integrated-vtysh-config
!
interface lo
 ip address 100.64.255.5/32
!
interface eth1
 ip address 100.64.1.1/30
!
interface eth2
 ip address 100.64.2.1/30
!
router bgp 65000
 bgp router-id 100.64.255.5
 no bgp ebgp-requires-policy
 neighbor 100.64.1.2 remote-as 65001
 neighbor 100.64.1.2 description SiteA
 neighbor 100.64.2.2 remote-as 65002
 neighbor 100.64.2.2 description SiteB
!
