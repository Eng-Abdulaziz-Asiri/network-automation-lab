name: Lab CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lab-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Containerlab, Ansible and PyYAML
        run: |
          bash -c "$(curl -sL https://get.containerlab.dev)"
          sudo apt-get update
          sudo apt-get install -y ansible python3-yaml
          containerlab version
          ansible --version

      - name: Deploy lab (5 routers + 2 hosts)
        run: sudo containerlab deploy -t topology.clab.yml --reconfigure

      - name: Configure routers with Ansible
        run: make configure

      - name: Health check (retry while OSPF/BGP converge)
        run: |
          for i in 1 2 3 4 5 6; do
            sleep 15
            if python3 scripts/summary.py; then exit 0; fi
            echo "Not healthy yet, retrying ($i/6)..."
          done
          exit 1

      - name: Debug info on failure
        if: failure()
        run: |
          sudo containerlab inspect -t topology.clab.yml || true
          for r in r1 r2 r3 r4 r5; do
            echo "===== $r ====="
            docker exec clab-netauto-$r vtysh -c "show ip route" || true
          done

      - name: Destroy lab
        if: always()
        run: sudo containerlab destroy -t topology.clab.yml --cleanup || true
